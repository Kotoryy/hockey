# Каждые 20 минут собирает данные КХЛ и публикует их в ветку data (зеркало, которое читает сайт).
# В ветке всегда один коммит: история не копится, репозиторий не разрастается.
name: Сбор данных

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Прошлые данные: если какая-то страница не загрузится, останется её предыдущая версия.
      - name: Прошлые данные
        run: git fetch --depth=1 origin data && git worktree add out origin/data || mkdir -p out

      - name: Сбор
        run: node collector/collect.js out

      - name: Публикация в ветку data
        working-directory: out
        run: |
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Данные $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
